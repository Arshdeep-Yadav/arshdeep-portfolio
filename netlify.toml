# Netlify configuration for one-click deploy
[build]
  publish = "."

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=604800"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=604800"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/og-card.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/site-icon.svg"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=604800"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/llm.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/robot.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    Expires = "Sun, 10 Oct 2027 00:00:00 GMT"
