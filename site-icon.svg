<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232520"/>
      <stop offset="100%" stop-color="#121311"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="80%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#ff6b50" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ff6b50" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121311" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e3da"/>
    </linearGradient>
    <linearGradient id="gradY" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff755d"/>
      <stop offset="100%" stop-color="#e44f35"/>
    </linearGradient>
    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#f5b82e"/>
    </linearGradient>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#topGlow)"/>
  <!-- Crisp inner bevel ring -->
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="3"/>

  <!-- Subtle Blueprint Coordinate Guides -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Monogram Group -->
  <g filter="url(#glyphShadow)">
    <!-- Letter A: Bold Geometric Apex -->
    <path d="M 84 382 L 168 132 H 208 L 292 382 H 238 L 219 322 H 157 L 138 382 Z M 171 276 H 205 L 188 200 Z" fill="url(#gradA)"/>
    
    <!-- Letter Y: Precision Dynamic Companion -->
    <path d="M 284 132 H 340 L 378 222 L 416 132 H 472 L 404 260 V 382 H 352 V 260 Z" fill="url(#gradY)"/>
  </g>

  <!-- Golden Status Spark / Pulse Beacon -->
  <g filter="url(#glyphShadow)">
    <circle cx="430" cy="88" r="22" fill="url(#goldPulse)"/>
    <circle cx="430" cy="88" r="9" fill="#ffffff"/>
  </g>
</svg>