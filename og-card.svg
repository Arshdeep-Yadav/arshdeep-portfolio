<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="100%" stop-color="#f1ece1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8f3"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e1e1c" flood-opacity="0.08"/>
    </filter>
    <filter id="stickyShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e1e1c" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="#f6f3ec"/>

  <!-- Subtle Engineering Grid -->
  <g opacity="0.06" stroke="#1e1e1c" stroke-width="1.5">
    <path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200M0 420h1200M0 490h1200M0 560h1200"/>
    <path d="M70 0v630M140 0v630M210 0v630M280 0v630M350 0v630M420 0v630M490 0v630M560 0v630M630 0v630M700 0v630M770 0v630M840 0v630M910 0v630M980 0v630M1050 0v630M1120 0v630"/>
  </g>

  <!-- Main Card Surface -->
  <rect x="60" y="50" width="1080" height="530" rx="36" fill="url(#cardGrad)" stroke="#1e1e1c" stroke-width="2.5" filter="url(#cardShadow)"/>
  
  <!-- Dashed Drafting Boundary -->
  <rect x="80" y="70" width="1040" height="490" rx="26" fill="none" stroke="#1e1e1c" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.2"/>

  <!-- Top Navigation Pill / Brand -->
  <g transform="translate(104, 98)">
    <circle cx="20" cy="20" r="20" fill="#1e1e1c"/>
    <text x="20" y="26" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">AY</text>
    <text x="52" y="25" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="13" fill="#1e1e1c" letter-spacing="2">ARSHDEEP / AI LAB</text>
  </g>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(850, 96)">
    <rect width="250" height="40" rx="20" fill="#ffffff" stroke="#1e1e1c" stroke-width="1.5"/>
    <circle cx="24" cy="20" r="5" fill="#258f50"/>
    <text x="40" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#1e1e1c" letter-spacing="1">OPEN TO ROLES · 2026</text>
  </g>

  <!-- Big Name and Headline -->
  <text x="104" y="240" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="68" fill="#1e1e1c" letter-spacing="-2">Arshdeep Yadav</text>
  
  <text x="104" y="294" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ee684f" letter-spacing="-0.5">AI/ML ENGINEER × PRODUCT BUILDER</text>
  
  <text x="104" y="348" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="500" font-size="21" fill="#4a473f">
    Computer Vision · Explainable AI (XAI) · Generative AI Products
  </text>

  <!-- Key Credential Chips -->
  <g transform="translate(104, 396)">
    <!-- Chip 1: IEEE -->
    <g transform="translate(0, 0)">
      <rect width="186" height="40" rx="10" fill="#ffffff" stroke="#1e1e1c" stroke-width="1.5"/>
      <text x="16" y="25" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#1e1e1c">✓ IEEE Published</text>
    </g>
    <!-- Chip 2: Bluestock -->
    <g transform="translate(202, 0)">
      <rect width="210" height="40" rx="10" fill="#ffffff" stroke="#1e1e1c" stroke-width="1.5"/>
      <text x="16" y="25" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#1e1e1c">✓ SDE @ Bluestock '25</text>
    </g>
    <!-- Chip 3: IIT Patna -->
    <g transform="translate(428, 0)">
      <rect width="206" height="40" rx="10" fill="#ffffff" stroke="#1e1e1c" stroke-width="1.5"/>
      <text x="16" y="25" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#1e1e1c">✓ MBA @ IIT Patna</text>
    </g>
  </g>

  <!-- Interactive Yellow Studio Note (Right Column) -->
  <g transform="translate(800, 200) rotate(3)" filter="url(#stickyShadow)">
    <rect width="280" height="230" rx="12" fill="#f4d566" stroke="#1e1e1c" stroke-width="2"/>
    <!-- Pushpin -->
    <circle cx="140" cy="16" r="8" fill="#ee684f" stroke="#1e1e1c" stroke-width="1.5"/>
    <text x="24" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#665314" letter-spacing="2">01 / NORTH STAR</text>
    <text x="24" y="92" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" fill="#1e1e1c" letter-spacing="-0.5">Build. Ship.</text>
    <text x="24" y="122" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="24" fill="#1e1e1c" letter-spacing="-0.5">Explain.</text>
    <text x="24" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#42381a">Taking vision &amp; XAI models</text>
    <text x="24" y="184" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#42381a">beyond notebooks to production.</text>
  </g>

  <!-- Footer Domain and Signature -->
  <g transform="translate(104, 510)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#1e1e1c" letter-spacing="1">arshdeep.works</text>
    <text x="560" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#757168">AI / PRODUCT / SYSTEMS</text>
  </g>
</svg>
