# ==============================================================================
# Nginx Configuration: Gzip Compression & Expires Headers Reference
# Arshdeep Yadav Portfolio — High Performance Static Optimization
# ==============================================================================

server {
    listen 80;
    server_name arshdeep.works www.arshdeep.works;
    root /var/www/arshdeep-portfolio;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. GZIP COMPRESSION (Fixes YSlow Grade F45: Compress components with gzip)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/markdown
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/xhtml+xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2
        font/ttf
        font/otf;

    # --------------------------------------------------------------------------
    # 2. FAR-FUTURE EXPIRES & CACHE-CONTROL (Fixes YSlow Grade D67: Add Expires)
    # --------------------------------------------------------------------------
    # Static Assets: CSS, JS, Fonts, Images
    location ~* \.(?:css|js|woff2|woff|ttf|otf|webp|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Manifests and Sitemaps
    location ~* \.(?:webmanifest|xml|json|txt|md)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # HTML Documents: No-cache revalidation
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
